cclib:
  excludes:
    - bison_keyword_token_codes_inc
    - ^mock_helpers$
    - ^test_payload$
    - ^initialize_required_fields_test$
    - benchmark
    - bazel:flex
  # absl/types/optional.h already includes internal/optional.h when not using
  # std::optional; including it again breaks C++17 ABSL_USES_STD_OPTIONAL.
  exclude_amalgamation_headers:
    - pkg: absl/types/optional
      headers:
        - absl/types/internal/optional.h
    # flex_tokenizer.flex.cc / flex_tokenizer.cc already pull in the tokenizer interface.
    - pkg: zetasql/parser/bison_parser_generated_lib
      headers:
        - zetasql/parser/flex_tokenizer.h
  # Generated flex is pulled in via parser bind_cc_prelude_before_headers; omit from per-file sources.
  exclude_amalgamation_sources:
    - pkg: zetasql/parser/bison_parser_generated_lib
      sources:
        # flex_tokenizer.flex.cc is included via parser/bind.cc prelude only.
        - zetasql/parser/flex_tokenizer.flex.cc
        # Grammar is amalgamated in zetasql/parser/parser only (parser FQDN matches flex_tokenizer).
        - zetasql/parser/bison_parser.bison.cc
        - zetasql/parser/join_processor.cc
    - pkg: zetasql/parser/parser
      sources:
        - zetasql/parser/flex_tokenizer.h
        - zetasql/parser/flex_tokenizer.cc
  bind_cc_prelude_before_headers:
    - pkg: zetasql/public/parse_helpers
      lines: |
        // parse_helpers.h includes parser.h → flex_tokenizer.h before parser/export.inc runs.
        #define ZETASQL_PARSER_FLEX_TOKENIZER_SUPPRESS_FLEXLEXER_STUBS
  # id_string / unicode_utils flags — only the parser amalgamation needs these defines.
  inject_replace_names:
    - pkg: zetasql/parser/parser
      after: FLAGS_nozetasql_canonicalize_signed_zero_to_string
      names:
        - FLAGS_zetasql_idstring_allow_unicode_characters
        - FLAGS_nozetasql_idstring_allow_unicode_characters
  extra_bind_go_imports:
    - pkg: zetasql/parser/parser
      imports:
        - github.com/goccy/go-zetasql/internal/ccall/go-zetasql/parser/bison_parser_generated_lib

