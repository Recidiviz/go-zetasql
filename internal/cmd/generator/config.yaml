cclib:
  # Link-only bind.cc: every googlesql/* cc_library uses thin bind_link_only.cc.tmpl (generator
  # linkOnlyBind). This list adds non-googlesql packages (e.g. base/status) to the same path.
  # Requires libgooglesql.a — see docs/link-only-cgo-migration.md.
  link_only_bind_packages:
    - base/status
    # base/logging.cc — //googlesql/base:logging in libgooglesql.a (extract_googlesql_unified_lib.sh).
    - base/logging
    # algorithms/util.cc is merged from com_google_cc_differential_privacy into libgooglesql.a;
    # link-only avoids compiling the .cc body in the CGO TU (see extract_googlesql_unified_lib.sh SEARCH_ROOTS).
    - algorithms/util
    # algorithms/distributions.cc — same DP archive closure as util.
    - algorithms/distributions
    # numerical-mechanisms.cc, rand.cc, gaussian-stddev-calculator.cc — objects in libgooglesql.a
    # (com_google_cc_differential_privacy extract); link-only avoids duplicate TUs vs unified archive.
    - algorithms/numerical-mechanisms
    - algorithms/rand
    - algorithms/internal/gaussian-stddev-calculator
    # gaussian-dp-calculator.cc — built into libgooglesql.a via
    # @com_google_cc_differential_privacy//algorithms:gaussian-dp-calculator (default_bazel_targets.txt).
    - algorithms/gaussian-dp-calculator
    # bounded-mean-ci.cc, count-tree.cc — same DP archive (default_bazel_targets.txt external targets).
    - algorithms/internal/bounded-mean-ci
    - algorithms/internal/count-tree
    # Differential-privacy protos: .pb.o live in libgooglesql.a (external DP repo); link-only avoids
    # duplicate TU bodies vs the unified archive. See docs/cgo-consolidation.md (class C).
    - proto/confidence_interval_cc_proto
    - proto/data_cc_proto
    - proto/numerical_mechanism_cc_proto
    - proto/summary_cc_proto
  # Unified absl/google: plain namespaces match go-protobuf amalgamation + single include policy.
  global_exclude_replace_names:
    - absl
    - google
  excludes:
    - bison_keyword_token_codes_inc
    # gmock-only test helpers; not available in default CGO/prebuilt CI headers.
    - ^optional_ref_matchers$
    - ^edge_matchers$
    - ^nfa_matchers$
    - ^mock_helpers$
    - ^test_payload$
    - ^initialize_required_fields_test$
    - benchmark
    - bazel:flex
  # absl/types/optional.h already includes internal/optional.h when not using
  # std::optional; including it again breaks C++17 ABSL_USES_STD_OPTIONAL.
  exclude_amalgamation_headers:
    - pkg: absl/types/optional
      headers:
        - absl/types/internal/optional.h
    # flex_tokenizer.flex.cc / flex_tokenizer.cc already pull in the tokenizer interface.
    - pkg: googlesql/parser/bison_parser_generated_lib
      headers:
        - googlesql/parser/flex_tokenizer.h
  # Generated flex is pulled in via parser bind_cc_prelude_before_headers; omit from per-file sources.
  exclude_amalgamation_sources:
    - pkg: googlesql/parser/bison_parser_generated_lib
      sources:
        # flex_tokenizer.flex.cc is included via parser/bind.cc prelude only.
        - googlesql/parser/flex_tokenizer.flex.cc
        # Grammar is amalgamated in googlesql/parser/parser only (parser FQDN matches flex_tokenizer).
        - googlesql/parser/bison_parser.bison.cc
        - googlesql/parser/join_processor.cc
    - pkg: googlesql/parser/parser
      sources:
        - googlesql/parser/flex_tokenizer.h
        - googlesql/parser/flex_tokenizer.cc
    - pkg: googlesql/public/options_cc_proto
      sources:
        # Single owner: googlesql/public/analyzer amalgamation (add_sources on analyzer.cc).
        - googlesql/public/options.pb.cc
    - pkg: googlesql/public/type_cc_proto
      sources:
        # Single owner: googlesql/public/analyzer amalgamation (add_sources on table_name_resolver.h).
        - googlesql/public/type.pb.cc
    - pkg: googlesql/public/proto/type_annotation_cc_proto
      sources:
        # Single owner: googlesql/public/analyzer (add_sources); wire_format pairs with proto/type_annotation.
        - googlesql/public/proto/type_annotation.pb.cc
        - googlesql/public/proto/wire_format_annotation.pb.cc
    # go-absl/types exception shards: Abseil object code is embedded in libprotobuf_cgo.a; do not
    # amalgamate these .cc bodies into per-shard CGO TUs (see docs/prebuilt-cgo.md, docs/prebuilt-absl-overlap.md).
    - pkg: absl/types/bad_optional_access
      sources:
        - absl/types/bad_optional_access.cc
    - pkg: absl/types/bad_variant_access
      sources:
        - absl/types/bad_variant_access.cc
    - pkg: absl/types/bad_any_cast_impl
      sources:
        - absl/types/bad_any_cast.cc
    # absl/strings/string_view.cc — object in libprotobuf_cgo.a (e.g. *string_view*.pic.o); same pattern as types/bad_*.
    - pkg: absl/strings/string_view
      sources:
        - absl/strings/string_view.cc
    # Batch-10 default-path go-absl slice: keep normal go-absl bind_*.go generation and omit only
    # proven archive-owned .cc bodies from per-shard amalgamation TUs.
    - pkg: absl/base/throw_delegate
      sources:
        - absl/base/internal/throw_delegate.cc
    - pkg: absl/base/log_severity
      sources:
        - absl/base/log_severity.cc
    - pkg: absl/base/strerror
      sources:
        - absl/base/internal/strerror.cc
    - pkg: absl/base/spinlock_wait
      sources:
        - absl/base/internal/spinlock_wait.cc
    - pkg: absl/numeric/int128
      sources:
        - absl/numeric/int128.cc
    - pkg: absl/hash/city
