cclib:
  # Link-only bind.cc: every googlesql/* cc_library uses thin bind_link_only.cc.tmpl (generator
  # linkOnlyBind). This list adds non-googlesql packages (e.g. base/status) to the same path.
  # Requires libgooglesql.a — see docs/link-only-cgo-migration.md.
  link_only_bind_packages:
    - base/status
  # Unified absl/google: plain namespaces match go-protobuf amalgamation + single include policy.
  global_exclude_replace_names:
    - absl
    - google
  excludes:
    - bison_keyword_token_codes_inc
    - ^mock_helpers$
    - ^test_payload$
    - ^initialize_required_fields_test$
    - benchmark
    - bazel:flex
  # absl/types/optional.h already includes internal/optional.h when not using
  # std::optional; including it again breaks C++17 ABSL_USES_STD_OPTIONAL.
  exclude_amalgamation_headers:
    - pkg: absl/types/optional
      headers:
        - absl/types/internal/optional.h
    # flex_tokenizer.flex.cc / flex_tokenizer.cc already pull in the tokenizer interface.
    - pkg: googlesql/parser/bison_parser_generated_lib
      headers:
        - googlesql/parser/flex_tokenizer.h
  # Generated flex is pulled in via parser bind_cc_prelude_before_headers; omit from per-file sources.
  exclude_amalgamation_sources:
    - pkg: googlesql/parser/bison_parser_generated_lib
      sources:
        # flex_tokenizer.flex.cc is included via parser/bind.cc prelude only.
        - googlesql/parser/flex_tokenizer.flex.cc
        # Grammar is amalgamated in googlesql/parser/parser only (parser FQDN matches flex_tokenizer).
        - googlesql/parser/bison_parser.bison.cc
        - googlesql/parser/join_processor.cc
    - pkg: googlesql/parser/parser
      sources:
        - googlesql/parser/flex_tokenizer.h
        - googlesql/parser/flex_tokenizer.cc
    - pkg: googlesql/public/options_cc_proto
      sources:
        # Single owner: googlesql/public/analyzer amalgamation (add_sources on analyzer.cc).
        - googlesql/public/options.pb.cc
    - pkg: googlesql/public/type_cc_proto
      sources:
        # Single owner: googlesql/public/analyzer amalgamation (add_sources on table_name_resolver.h).
        - googlesql/public/type.pb.cc
    - pkg: googlesql/public/proto/type_annotation_cc_proto
      sources:
        # Single owner: googlesql/public/analyzer (add_sources); wire_format pairs with proto/type_annotation.
        - googlesql/public/proto/type_annotation.pb.cc
        - googlesql/public/proto/wire_format_annotation.pb.cc
  bind_cc_prelude_before_headers:
    - pkg: googlesql/parser/parser
      lines: |
        // flex_tokenizer.flex.cc defines yyFlexLexer::{yylex,yywrap}; suppress flex_tokenizer.h inline stubs.
        #define GOOGLESQL_PARSER_FLEX_TOKENIZER_SUPPRESS_FLEXLEXER_STUBS
        // flex_prelude uses distinct Legacyalloc symbols from root analyzer (see flex_prelude in add_sources).
        #define GOOGLESQL_GO_FLEX_LEGACY_IN_PARSER_PKG 1
        // Link-only parser bridge helpers construct ParseResumeLocation directly.
        #include "googlesql/public/parse_resume_location.h"
    - pkg: googlesql/public/parse_helpers
      lines: |
        // parse_helpers.h includes parser.h → flex_tokenizer.h before parser/export.inc runs.
        #define GOOGLESQL_PARSER_FLEX_TOKENIZER_SUPPRESS_FLEXLEXER_STUBS
  # Parser/bison CGO packages link with the root analyzer TU; align googlesql* namespace
  # mangling with go-googlesql/public/analyzer (root_analyzer_amalgamation_macros.inc) so
  # protobuf extensions and shared types resolve across packages.
  symbol_define_overrides:
    - pkg: googlesql/parser/parser
      symbol: googlesql
      replacement: googlesql_public_analyzer_googlesql
    - pkg: googlesql/parser/parser
      symbol: googlesql_base
      replacement: googlesql_public_analyzer_googlesql_base
    - pkg: googlesql/parser/parser
      symbol: googlesql_bison_parser
      replacement: googlesql_public_analyzer_googlesql_bison_parser
    - pkg: googlesql/parser/bison_parser_generated_lib
      symbol: googlesql
      replacement: googlesql_public_analyzer_googlesql
    - pkg: googlesql/parser/bison_parser_generated_lib
      symbol: googlesql_base
      replacement: googlesql_public_analyzer_googlesql_base
    - pkg: googlesql/parser/bison_parser_generated_lib
      symbol: googlesql_bison_parser
      replacement: googlesql_public_analyzer_googlesql_bison_parser
    # bridge.inc still uses zetasql:: for legacy generators; map to the same mangled
    # googlesql namespace as the rest of the root analyzer TU.
    - pkg: googlesql/public/analyzer
      symbol: zetasql
      replacement: googlesql_public_analyzer_googlesql
  # id_string / unicode_utils flags — only the parser amalgamation needs these defines.
  inject_replace_names:
    - pkg: googlesql/public/analyzer
      after: googlesql
      names:
        - zetasql
    - pkg: googlesql/parser/parser
      after: FLAGS_nogooglesql_canonicalize_signed_zero_to_string
      names:
        - FLAGS_googlesql_idstring_allow_unicode_characters
        - FLAGS_nogooglesql_idstring_allow_unicode_characters
  extra_bind_go_imports:
    - pkg: googlesql/parser/parser
      imports:
        - github.com/vantaboard/go-googlesql/internal/ccall/go-googlesql/parser/bison_parser_generated_lib
        - github.com/vantaboard/go-googlesql/internal/ccall/go-protobuf/protobuf
    # Parser/bison TUs include protobuf headers; link go-protobuf for out-of-line symbols.
    - pkg: googlesql/parser/bison_parser_generated_lib
      imports:
        - github.com/vantaboard/go-googlesql/internal/ccall/go-protobuf/protobuf
    - pkg: googlesql/public/analyzer
      imports:
