    - pkg: googlesql/public/sql_formatter
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
        - differential_privacy
    - pkg: googlesql/parser/bison_parser_generated_lib
      names:
        - googlesql
