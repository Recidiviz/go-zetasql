  bind_cc_prelude_before_headers:
    - pkg: googlesql/parser/parser
      lines: |
        // flex_tokenizer.flex.cc defines yyFlexLexer::{yylex,yywrap}; suppress flex_tokenizer.h inline stubs.
        #define GOOGLESQL_PARSER_FLEX_TOKENIZER_SUPPRESS_FLEXLEXER_STUBS
        // flex_prelude uses distinct Legacyalloc symbols from root analyzer (see flex_prelude in add_sources).
        #define GOOGLESQL_GO_FLEX_LEGACY_IN_PARSER_PKG 1
        // Link-only parser bridge helpers construct ParseResumeLocation directly.
        #include "googlesql/public/parse_resume_location.h"
    - pkg: googlesql/public/parse_helpers
      lines: |
        // parse_helpers.h includes parser.h → flex_tokenizer.h before parser/export.inc runs.
        #define GOOGLESQL_PARSER_FLEX_TOKENIZER_SUPPRESS_FLEXLEXER_STUBS
    - pkg: googlesql/public/range_value
      lines: |
        #include "googlesql/base/status_macros.h"
  # Parser/bison CGO packages link with the root analyzer TU; align googlesql* namespace
  # mangling with go-googlesql/public/analyzer (root_analyzer_amalgamation_macros.inc) so
  # protobuf extensions and shared types resolve across packages.
  symbol_define_overrides:
    - pkg: googlesql/parser/parser
      symbol: googlesql
      replacement: googlesql_public_analyzer_googlesql
    - pkg: googlesql/parser/parser
      symbol: googlesql_base
      replacement: googlesql_public_analyzer_googlesql_base
    - pkg: googlesql/parser/parser
      symbol: googlesql_bison_parser
      replacement: googlesql_public_analyzer_googlesql_bison_parser
    - pkg: googlesql/parser/bison_parser_generated_lib
      symbol: googlesql
      replacement: googlesql_public_analyzer_googlesql
    - pkg: googlesql/parser/bison_parser_generated_lib
      symbol: googlesql_base
      replacement: googlesql_public_analyzer_googlesql_base
    - pkg: googlesql/parser/bison_parser_generated_lib
      symbol: googlesql_bison_parser
      replacement: googlesql_public_analyzer_googlesql_bison_parser
  # id_string / unicode_utils flags — only the parser amalgamation needs these defines.
  inject_replace_names:
    - pkg: googlesql/parser/parser
      after: FLAGS_nogooglesql_canonicalize_signed_zero_to_string
      names:
        - FLAGS_googlesql_idstring_allow_unicode_characters
        - FLAGS_nogooglesql_idstring_allow_unicode_characters
  extra_bind_go_imports:
    - pkg: googlesql/parser/parser
      imports:
        - github.com/vantaboard/go-googlesql/internal/ccall/go-googlesql/parser/bison_parser_generated_lib
        - github.com/vantaboard/go-googlesql/internal/ccall/go-protobuf/protobuf
    # Parser/bison TUs include protobuf headers; link go-protobuf for out-of-line symbols.
    - pkg: googlesql/parser/bison_parser_generated_lib
      imports:
        - github.com/vantaboard/go-googlesql/internal/ccall/go-protobuf/protobuf
    - pkg: googlesql/public/analyzer
      imports:
        - github.com/vantaboard/go-googlesql/internal/ccall/go-protobuf/protobuf
    # Same as analyzer: renaming `google` breaks protobuf amalgamation; link go-protobuf/protobuf.
    - pkg: googlesql/public/catalog
      imports:
        - github.com/vantaboard/go-googlesql/internal/ccall/go-protobuf/protobuf
  omit_extern_c_around_bridge_inc:
    - googlesql/public/catalog
  omit_cgo_export_prolog:
    - googlesql/public/catalog
  # type_annotation_cc_proto amalgamates wire_format_annotation.pb.cc; drop stale duplicate export.inc.
  omit_dependency_export_includes:
    - pkg: googlesql/public/types/type
      deps:
        - googlesql/public/proto/wire_format_annotation_cc_proto
  # Link-only + libgooglesql.a: use upstream namespaces (Bazel *.pic.o) for the GOOGLESQL_LINK_ONLY_BIND branch only.
  exclude_replace_names:
    - pkg: base/status
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
        - differential_privacy
    - pkg: proto/confidence_interval_cc_proto
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
        - differential_privacy
    - pkg: proto/data_cc_proto
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
        - differential_privacy
    - pkg: proto/numerical_mechanism_cc_proto
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
        - differential_privacy
    - pkg: proto/summary_cc_proto
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
        - differential_privacy
    - pkg: googlesql/public/analyzer
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
        - differential_privacy
    - pkg: googlesql/public/catalog
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
        - differential_privacy
    - pkg: googlesql/public/simple_catalog
      names:
        - googlesql
        - googlesql_base
        - googlesql_bison_parser
        - re2
