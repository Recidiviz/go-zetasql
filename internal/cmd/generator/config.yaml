add_sources:
  # flex_tokenizer.cc must share the parser package FQDN with bison_parser.cc (not bison_parser_generated_lib).
  # Grammar must be #included before bison_parser.cc (stack-allocated BisonParserImpl needs complete type).
  - file: zetasql/parser/bison_parser.cc
    source: zetasql/parser/flex_tokenizer.cc
    before_includes:
      - zetasql/parser/bison_parser.bison.cc
    # join_processor.cc includes bison_parser.bison.h → flex_tokenizer.h; it must run after #undef yylex
    # (see flex_prelude), not immediately after bison_parser.bison.cc.
    flex_prelude: |
      // bison_parser.bison.cc defines yylex as a macro; must clear before any flex_tokenizer / FlexLexer.h.
      #undef yylex
      #include "zetasql/parser/join_processor.cc"
      // utf8_validity.cc: single copy via blank-import utf8_range_link (see go-protobuf/protobuf/export.inc).
      #include "zetasql/parser/flex_tokenizer.h"
      #include "zetasql/parser/flex_tokenizer.flex.cc"

