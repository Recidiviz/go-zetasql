# Upstream 2026.01.1+ uses Textmapper only; tm_parser sources are amalgamated after parser_internal.cc
# (see generator: skip tm_parser export.inc for parser — avoids duplicating bison/export.inc).
add_sources:
  - file: googlesql/parser/parser_internal.cc
    after_includes:
      - googlesql/parser/textmapper_lexer_adapter.cc
      - googlesql/parser/tm_parser.cc
      - googlesql/parser/join_processor.cc
  # options.pb.cc / type.pb.cc compile in the same googlesql namespace shard as consumers (analyzer).
  # public/options_cc_proto and public/type_cc_proto export.inc are header-only; .cc is amalgamated here only.
  # After table_name_resolver.cc + .h (matches prior order: sources then options/type from export.inc).
  - file: googlesql/public/table_name_resolver.h
    after_includes:
      - googlesql/public/options.pb.cc
      - googlesql/public/type.pb.cc
      - googlesql/public/proto/type_annotation.pb.cc
      - googlesql/public/proto/wire_format_annotation.pb.cc

