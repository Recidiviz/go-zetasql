# Attach the default protobuf prebuilt tarball + SHA256SUMS to the same tag as the Docker release.
# Primary "no Bazel" artifact for linux_amd64 (see docs/prebuilt-cgo.md, docs/ci-bazel-cache.md).
name: Release prebuilt archives
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  protobuf-prebuilt-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Install clang and bazelisk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          go install github.com/bazelbuild/bazelisk@v1.20.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cache Bazel
        uses: actions/cache@1bd1e32a3bdcfcb76bb0b4f9d2ae9643b0fe58f7 # v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-googlesql-${{ hashFiles('internal/cmd/updater/googlesql/MODULE.bazel', 'internal/cmd/updater/googlesql/MODULE.bazel.lock', 'internal/cmd/updater/googlesql/.bazelversion') }}
          restore-keys: |
            ${{ runner.os }}-bazel-googlesql-
      - name: Build and verify prebuilts
        run: |
          task verify:protobuf-tier-b verify:tier-b-cgo-policy prebuilt:protobuf verify:prebuilt-protobuf
        env:
          CC: clang
          CXX: clang++
          BAZEL_JOBS: "4"
      - name: Package release tarball and checksums
        run: |
          OUT="go-googlesql-prebuilts-protobuf-linux_amd64-${GITHUB_REF_NAME}.tar.gz"
          OUTPUT_NAME="$OUT" bash scripts/package-protobuf-prebuilt.sh
          sha256sum "$OUT" > SHA256SUMS
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            go-googlesql-prebuilts-protobuf-linux_amd64-*.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
