# Unified libgooglesql.a + CGO smoke build. Default Bazel labels: internal/ccall/go-googlesql-unified/default_bazel_targets.txt
name: Unified libgooglesql prebuilt
on:
  workflow_dispatch:
  schedule:
    # Weekly regression + Bazel cache warmth (same job as manual; optional full analyzer override stays local / dispatch-only).
    - cron: "0 6 * * 1"

jobs:
  libgooglesql-unified:
    name: prebuilt-libs-googlesql-unified + go build (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Install clang, llvm (llvm-nm), and bazelisk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm
          go install github.com/bazelbuild/bazelisk@v1.20.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cache Bazel
        uses: actions/cache@1bd1e32a3bdcfcb76bb0b4f9d2ae9643b0fe58f7 # v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-googlesql-${{ hashFiles('internal/cmd/updater/googlesql/MODULE.bazel', 'internal/cmd/updater/googlesql/MODULE.bazel.lock', 'internal/cmd/updater/googlesql/.bazelversion') }}
          restore-keys: |
            ${{ runner.os }}-bazel-googlesql-
      # Root unified-prebuilt CGO links libprotobuf_cgo.a (gitignored); build it before any verify/build that pulls go-protobuf.
      - name: Build libprotobuf_cgo.a
        run: make prebuilt-libs
        env:
          BAZEL_JOBS: "4"
      - name: Build libgooglesql.a
        run: make prebuilt-libs-googlesql-unified
        env:
          BAZEL_JOBS: "4"
      - name: Verify archives
        run: make verify-prebuilt-googlesql-unified
      - name: CGO smoke build (googlesqlunified)
        run: make local/build-prebuilt-googlesql-unified
        env:
          CGO_ENABLED: "1"
      - name: Root package build (unified root slice)
        run: make local/build-prebuilt-googlesql-unified-root
        env:
          CGO_ENABLED: "1"
      - name: Root unified-prebuilt test gate (default analyzer shard)
        run: make local/test-prebuilt-googlesql-unified-root
        env:
          CGO_ENABLED: "1"
      - name: Native C link smoke
        run: bash scripts/smoke_link_googlesql_unified.sh
