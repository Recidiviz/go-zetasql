# Manual: unified libgooglesql.a + CGO smoke build. workflow_dispatch only.
name: Unified libgooglesql prebuilt
on:
  workflow_dispatch:

jobs:
  libgooglesql-unified:
    name: prebuilt-libs-googlesql-unified + go build (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Install clang and bazelisk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          go install github.com/bazelbuild/bazelisk@v1.20.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build libgooglesql.a
        run: make prebuilt-libs-googlesql-unified
        env:
          CC: clang
          CXX: clang++
          BAZEL_JOBS: "4"
      - name: Verify archive
        run: make verify-prebuilt-googlesql-unified
      - name: CGO smoke build (googlesqlunified)
        run: make local/build-prebuilt-googlesql-unified
        env:
          CC: clang
          CXX: clang++
          CGO_ENABLED: "1"
          CGO_LDFLAGS_ALLOW: "-Wl,--no-gc-sections|-Wl,--allow-multiple-definition|-fuse-ld=mold"
          CGO_LDFLAGS: "-Wl,--no-gc-sections -Wl,--allow-multiple-definition"
      - name: Native C link smoke
        run: bash scripts/smoke_link_googlesql_unified.sh
        env:
          CC: clang
