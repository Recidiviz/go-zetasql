# Manual default-prebuilt protobuf check: Bazel-built libprotobuf_cgo.a + focused Go test.
# Not run on every PR (Bazel first build can be slow). Use workflow_dispatch before releases
# or when changing extract_protobuf_cgo_lib.sh / default protobuf bind files.
name: Default prebuilt protobuf
on:
  workflow_dispatch:

jobs:
  prebuilt-protobuf:
    name: prebuilt-libs + test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Clone GoogleSQL workspace (pinned ref)
        run: bash scripts/ensure-googlesql-workspace.sh
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Install clang and bazelisk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          go install github.com/bazelbuild/bazelisk@v1.20.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cache Bazel
        uses: actions/cache@1bd1e32a3bdcfcb76bb0b4f9d2ae9643b0fe58f7 # v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-googlesql-${{ hashFiles('internal/cmd/updater/googlesql.ref', 'internal/cmd/updater/Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-bazel-googlesql-
      - name: Protobuf prebuilt alignment check
        run: task verify:protobuf-tier-b
      - name: Prebuilt tag policy
        run: task verify:tier-b-cgo-policy
      - name: Build libprotobuf_cgo.a
        run: task prebuilt:protobuf
        env:
          CC: clang
          CXX: clang++
          BAZEL_JOBS: "4"
      - name: Verify archive
        run: task verify:prebuilt-protobuf
      - name: Test default prebuilt protobuf package
        run: task test:protobuf-cgo
        env:
          CC: clang
          CXX: clang++
