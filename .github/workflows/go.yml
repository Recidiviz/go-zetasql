name: Go (default prebuilts)
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ "ubuntu-latest", "macos-latest" ]
        go-version: [ "1.24" ]
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
    steps:
    - name: checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: recursive
    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x
    - name: setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
    - name: Install ccache (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache
    - name: Install ccache (macOS)
      if: runner.os == 'macOS'
      run: brew install ccache
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}
        restore-keys: |
          ccache-${{ runner.os }}-
    - name: Install bazelisk (Linux)
      if: runner.os == 'Linux'
      run: |
        go install github.com/bazelbuild/bazelisk@v1.20.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Install bazelisk (macOS)
      if: runner.os == 'macOS'
      run: brew install bazelisk
    - name: Cache Bazel
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-${{ runner.os }}-${{ hashFiles('internal/cmd/updater/googlesql/MODULE.bazel', 'internal/cmd/updater/googlesql/MODULE.bazel.lock', 'internal/cmd/updater/googlesql/.bazelversion') }}
        restore-keys: |
          bazel-${{ runner.os }}-
    - name: Build default protobuf prebuilts
      run: |
        task verify:protobuf-tier-b verify:tier-b-cgo-policy prebuilt:protobuf verify:prebuilt-protobuf
      env:
        CC: clang
        CXX: clang++
        BAZEL_JOBS: "4"
    - name: Build libgooglesql.a (unified prebuilt)
      run: |
        task prebuilt:googlesql-unified verify:prebuilt-googlesql-unified
      env:
        CC: clang
        CXX: clang++
        BAZEL_JOBS: "4"
    - name: test
      run: task test:local TESTPKG=./
      env:
        CC: ccache clang
        CXX: ccache clang++
