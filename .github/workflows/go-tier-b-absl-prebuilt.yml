# Manual Abseil Tier B: Bazel-built libabsl_cgo.a + pilot package test.
# Not run on every PR. Use workflow_dispatch when changing extract_absl_cgo_lib.sh / bind_tier_b_absl.go.
name: Tier B prebuilt Abseil
on:
  workflow_dispatch:

jobs:
  tier-b-absl-prebuilt:
    name: prebuilt-libs-absl + pilot test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Install clang and bazelisk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          go install github.com/bazelbuild/bazelisk@v1.20.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cache Bazel
        uses: actions/cache@1bd1e32a3bdcfcb76bb0b4f9d2ae9643b0fe58f7 # v4
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-googlesql-${{ hashFiles('internal/cmd/updater/googlesql/MODULE.bazel', 'internal/cmd/updater/googlesql/MODULE.bazel.lock', 'internal/cmd/updater/googlesql/.bazelversion') }}
          restore-keys: |
            ${{ runner.os }}-bazel-googlesql-
      - name: Tier B tag policy
        run: task verify:tier-b-cgo-policy
      - name: Build libabsl_cgo.a
        run: task prebuilt:absl
        env:
          CC: clang
          CXX: clang++
          BAZEL_JOBS: "4"
      - name: Verify archive
        run: task verify:prebuilt-absl
      - name: Test Abseil Tier B pilot package
        run: task test:tier-b-absl
        env:
          CC: clang
          CXX: clang++
      - name: Build widened go-absl patterns (meta + types + base)
        run: task build:tier-b-absl BUILDPKG_ABSL='./internal/ccall/go-absl/meta/... ./internal/ccall/go-absl/types/... ./internal/ccall/go-absl/base/...'
        env:
          CC: clang
          CXX: clang++
