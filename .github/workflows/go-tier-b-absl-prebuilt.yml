# Manual Abseil Tier B: Bazel-built libabsl_cgo.a + pilot package test.
# Not run on every PR. Use workflow_dispatch when changing extract_absl_cgo_lib.sh / bind_tier_b_absl.go.
name: Tier B prebuilt Abseil
on:
  workflow_dispatch:

jobs:
  tier-b-absl-prebuilt:
    name: prebuilt-libs-absl + pilot test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum
      - name: Install clang and bazelisk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          go install github.com/bazelbuild/bazelisk@v1.20.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build libabsl_cgo.a
        run: make prebuilt-libs-absl
        env:
          CC: clang
          CXX: clang++
          BAZEL_JOBS: "4"
      - name: Verify archive
        run: make verify-prebuilt-absl
      - name: Test Abseil Tier B pilot package
        run: make local/test-prebuilt-absl
        env:
          CC: clang
          CXX: clang++
