# Temporary helper: fetches the official Zig toolchain tarball and pushes it
# to the tmp/zig-toolchain branch so that sandboxed dev environments (whose
# network egress cannot reach ziglang.org) can obtain Zig through the repo
# remote. Safe to delete once Zig-based development is finished.
name: zig-toolchain

on:
  push:
    branches: [claude/zig-zetasql-analyzer-bua2s9]
    paths: ['.github/workflows/zig-toolchain.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Zig 0.14.1 and push to tmp/zig-toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSLO https://ziglang.org/download/0.14.1/zig-linux-x86_64-0.14.1.tar.xz \
            || curl -fsSLO https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          ls -la *.tar.xz
          mkdir zigrepo && cd zigrepo
          git init -b tmp/zig-toolchain
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          mv ../zig-*.tar.xz .
          sha256sum *.tar.xz > SHA256SUMS
          git add -A
          git commit -m "Zig 0.14.1 linux x86_64 toolchain tarball (temporary)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp/zig-toolchain
